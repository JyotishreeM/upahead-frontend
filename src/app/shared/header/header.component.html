<nav class="navbar navbar-expand-lg app-surface shadow-sm">

  <div class="container-fluid px-4">

    <!-- Application Name -->
    <a
      class="navbar-brand fw-bold"
      routerLink="/guest-dashboard"
    >
      UpAhead
    </a>


    <!-- Right side -->
    <div class="d-flex align-items-center gap-3">

        <!-- Theme Toggle -->
      <button
        class="btn btn-outline-secondary btn-sm"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="
          themeService.currentTheme() === 'light'
            ? 'Switch to dark mode'
            : 'Switch to light mode'
        "
      >
        @if (themeService.currentTheme() === 'light') {
          Dark mode
        } @else {
          Light mode
        }
      </button>
      <!-- Username -->
      <div class="user-info">

        <span class="text-muted small">
          Welcome,
        </span>

        <span class="fw-semibold">
          {{ userName }}
        </span>

      </div>


      <!-- Profile -->
      <button
        class="btn btn-outline-primary btn-sm"
        type="button" (click)="goToProfile()"
      >
        Profile
      </button>


      <!-- Logout -->
      <button
        class="btn btn-outline-danger btn-sm"
        type="button"
        (click)="logout()"
      >
        Logout
      </button>

    </div>

  </div>

</nav>
