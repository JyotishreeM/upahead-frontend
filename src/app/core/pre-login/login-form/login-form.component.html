<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center app-background">

  <div class="card shadow p-4" style="width: 400px;">

    <div class="text-center mb-4">
      <h2 class="fw-bold">Login</h2>
      <p class="text-muted">Login to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      @if (errorMessage) {
        <div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
      }

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">
          Email
        </label>

        <input id="email" type="email" class="form-control" formControlName="email" placeholder="Enter your email" />

        <div class="text-danger small mt-1" *ngIf="loginForm.get('email')?.touched &&
                 loginForm.get('email')?.invalid">
          Please enter a valid email.
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label for="password" class="form-label">
          Password
        </label>

        <input id="password" type="password" class="form-control" formControlName="password"
          placeholder="Enter your password" />

        <div class="text-danger small mt-1" *ngIf="loginForm.get('password')?.touched &&
                 loginForm.get('password')?.invalid">
          Password is required.
        </div>
      </div>

      <!-- Login Button -->
      <button *ngIf="!isLoading"  type="submit" class="btn btn-primary btn-lg w-100" [disabled]="loginForm.invalid">
        Login
      </button>

       <!-- Loading button -->
                <button
                  *ngIf="isLoading"
                  type="button"
                  class="btn btn-primary btn-lg"
                  disabled
                >
                  <span
                    class="spinner-border spinner-border-sm me-2"
                    role="status"
                    aria-hidden="true"
                  ></span>

                  Please Wait...
                </button>
      <!-- for new guest -->
      <div class="text-center mt-3">
        <span class="text-muted">New guest?</span>
        <a routerLink="/register" class="ms-1 text-decoration-none">
          Register here
        </a>
      </div>
    </form>

  </div>

</div>
